<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição em Evento</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Inscrição em Evento</h1>
        <p>Preencha os dados para realizar sua inscrição.</p>

        <form id="formulario">
            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="estado">Estado:</label>
            <select id="estado" name="estado" required>
                <option value="">Carregando estados...</option>
            </select>

            <label for="cidade">Cidade:</label>
            <select id="cidade" name="cidade" required disabled>
                <option value="">Selecione um estado primeiro</option>
            </select>

            <p id="quantidade-cidades" class="informacao"></p>

            <label for="filtro-cidades">Filtrar cidades:</label>
            <input
                type="text"
                id="filtro-cidades"
                placeholder="Digite o nome da cidade"
                disabled
            >

            <button type="submit" id="botao-inscrever">Inscrever</button>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>

        <section id="resumo" class="resumo" hidden>
            <h2>Resumo da inscrição</h2>
            <p id="texto-resumo"></p>
        </section>
    </main>
</body>
</html>
